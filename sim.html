<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Прогон турниров</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b050c; color: #eee; font: 14px system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; top: 10px; left: 10px; background: #120914e6; border: 1px solid #ffc53144; border-radius: 12px; padding: 10px 14px; max-width: 340px; }
    #hud b { color: #ffc531; }
    #hud label { display: block; margin-top: 6px; }
    #trig { margin-top: 6px; line-height: 1.6; }
    #errs { margin-top: 8px; color: #ff7b6e; max-height: 40vh; overflow-y: auto; font-size: 12px; white-space: pre-wrap; }
    button { background: #2a1630; color: #ffc531; border: 1px solid #ffc53166; border-radius: 8px; padding: 3px 10px; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div>Турниров: <b id="done">0</b> · ходов/с: <b id="sps">0</b> · ошибок: <b id="nerr">0</b></div>
    <label>Скорость <input id="speed" type="range" min="1" max="300" value="20" /></label>
    <label>Столов <input id="tables" type="range" min="1" max="36" value="12" /></label>
    <label>Наборы <select id="sets"><option value="mix">все вперемешку</option><option value="base">🌋 основа</option><option value="swamp">🍄 болото</option><option value="both">🌋+🍄 вместе</option></select></label>
    <label><button id="pause">⏸ Пауза</button></label>
    <div id="trig"></div>
    <div id="errs"></div>
  </div>
  <script type="module" src="/src/sim/main.ts"></script>
</body>
</html>
